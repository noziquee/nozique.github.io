<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design test page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Instrument+Sans:wght@400;500;600&display=swap"
    />
    <style>
      body { margin: 0; padding: 24px; background: #0b0b0c; color: #f2f2f2; font-family: system-ui, sans-serif; }
      h1 { margin: 0 0 4px; font-size: 22px; }
      p { color: #9a9a9a; margin: 0 0 16px; }
      .layout { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(0, 2fr); gap: 24px; }
      @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
      textarea { width: 100%; height: 520px; box-sizing: border-box; padding: 10px; background: #151517; color: #f2f2f2; border: 1px solid #2a2a2e; border-radius: 8px; font: 12px/1.5 ui-monospace, monospace; }
      #errors { color: #ff7a73; padding-left: 18px; font-size: 14px; }
      #status { color: #3fb67a; font-size: 14px; min-height: 20px; }
      #stage { border: 1px solid #2a2a2e; border-radius: 8px; overflow: hidden; background: #151517; }
    </style>
  </head>
  <body>
    <h1>Design test page</h1>
    <p>Developer tool, only available with <code>npm run dev</code>. Edit the JSON on the left; the design is checked and drawn on the right.</p>
    <div class="layout">
      <section>
        <textarea id="json" spellcheck="false" aria-label="Design JSON"></textarea>
        <p id="status" role="status"></p>
        <ul id="errors" role="alert"></ul>
      </section>
      <section>
        <div id="stage"></div>
      </section>
    </div>
    <script type="module" src="/src/dev/design-test.ts"></script>
  </body>
</html>
