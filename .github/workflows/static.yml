# Build, test and deploy the Nozique site (public site + /admin/) to GitHub Pages.
# - Every push and pull request: install, check (types, lint, format, tests) and build.
# - Pushes to main only: publish the built dist/ folder to GitHub Pages.
name: Build and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public values (shipped to every visitor's browser by design). Never put secrets here.
  VITE_SUPABASE_URL: https://oyloekgurghcodumywnw.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_TnuPieEFxej8SdaLaWIO8g_El2yPYov

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Check (types, lint, format, tests)
        run: npm run check
      - name: Build
        run: npm run build
      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
